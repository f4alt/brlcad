  linux_performance:
    name: Performance Runner
#    needs: [linux_bext]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    if: >
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      DEBIAN_FRONTEND: noninteractive

      RESULTS_ROOT: ${{ github.workspace }}/perf-results

      ###
      # Lane aggregation config.
      # Each lane maps to:
      #   <UPPER_LANE>_DESCRIPTION
      #   <UPPER_LANE>_STATUS
      #   <UPPER_LANE>_SUMMARY
      ###
      PERF_LANES: "benchmark rtcmp_prims rtcmp_generic"

      RUN_RTCMP_GENERIC: "1"
      RTCMP_GENERIC_DESCRIPTION: "run rtcmp comparison and performance tests across general models"
      RTCMP_GENERIC_STATUS: "0"
      RTCMP_GENERIC_SUMMARY: ${{ github.workspace }}/perf-results/rtcmp-generic/artifacts/summary.csv
      # rtcmp_generic comparison knobs
      BRLCAD_RELEASE_PACKAGE_URL: https://github.com/BRL-CAD/brlcad/releases/download/rel-7-42-0/BRL-CAD_7.42.0_Linux_x86_64.tar.gz
      RTCMP_WORK_DIR: ${{ github.workspace }}/rtcmp-generic-work
      RTCMP_RESULTS_DIR: ${{ github.workspace }}/perf-results/rtcmp-generic/artifacts
      RAYS_PER_VIEW: "100"
      PERF_SECONDS: "1"
      PERF_FAIL_THRESHOLD_PCT: "20"
      # MODEL_DIRS intentionally omitted for now; generic runner can use fallback.
      # NUM_CPUS: "0"
      # PERF_MAX_MEMORY: "0"
      # CLEANUP_OUTPUT_ARTIFACTS: "1"
      # LOG_LEVEL: "0"

      RUN_RTCMP_PRIMS: "0"
      RTCMP_PRIMS_DESCRIPTION: "prims"
      RTCMP_PRIMS_STATUS: "0"
      RTCMP_PRIMS_RESULTS_DIR: ${{ github.workspace }}/perf-results/rtcmp-prims
      RTCMP_PRIMS_SUMMARY: ${{ github.workspace }}/perf-results/rtcmp-prims/prims_summary.csv
      # rtcmp_prims knobs
      PRIMS_PERF_SECONDS: "1"

      RUN_BENCHMARK: "1"
      BENCHMARK_DESCRIPTION: "run the BRL-CAD benchmark and capture the VGR"
      BENCHMARK_STATUS: "0"
      BENCHMARK_SUMMARY: ${{ github.workspace }}/perf-results/benchmark/summary.csv
      
      BENCHMARK_RESULTS_DIR: ${{ github.workspace }}/perf-results/benchmark
      BENCHMARK_BUILD_NAME: "compare"
      BENCHMARK_TIMEFRAME: "1"
      BENCHMARK_MAXTIME: "15"
      #BENCHMARK_AVERAGE: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: brlcad

      #TODO: do we need this?
      #- name: Install dependencies

#      - name: Download BRL-CAD comparison package
#        uses: actions/download-artifact@v4
#        with:
#          name: brlcad-main-linux-package
#          path: main-package

      - name: Run rtcmp generic comparison
        run: |
          # make sure dirs exist
          mkdir -p "$RTCMP_RESULTS_DIR"

          status=0
          # run the compare script?
          if [ "$RUN_RTCMP_GENERIC" = "1" ]; then
            script_path="brlcad/.github/helper-scripts/rtcmp_generic_runner.sh"
            test -f "$script_path"
            chmod +x "$script_path"

            # For current lightweight wiring tests, compare release package to itself.
            # Later, replace first argument with "$compare_pkg" from the linux_bext artifact.
            set +e
            "$script_path" "$BRLCAD_RELEASE_PACKAGE_URL" "$BRLCAD_RELEASE_PACKAGE_URL"
            status=$?
            set -e
          fi

          echo "RTCMP_GENERIC_STATUS=$status" >> "$GITHUB_ENV"
          echo "RTCMP_GENERIC_SUMMARY=$RTCMP_RESULTS_DIR/summary.csv" >> "$GITHUB_ENV"

          # Do not exit with $status here; let aggregation run first.
          exit 0

      - name: Run rtcmp primitive performance
        run: |
          mkdir -p "$RTCMP_PRIMS_RESULTS_DIR"

          status=0

          if [ "$RUN_RTCMP_PRIMS" = "1" ]; then
            script_path="brlcad/.github/helper-scripts/rtcmp_prims_runner.sh"
            test -f "$script_path"
            chmod +x "$script_path"

            # cheat for now: rtcmp_generic ran first, so reuse its compare build
            release_mged="$(find "$RTCMP_WORK_DIR/brlcad-release" -type f -path '*/bin/mged' | sort | head -n 1)"
            test -n "$release_mged"
            brl_prefix="$(dirname "$(dirname "$release_mged")")"
            prims_g="$brl_prefix/share/db/primitives.g"
            # FIXME: this will need to be rtcmp-build-compare/ when we revert the only release stub
            compare_rtcmp="$RTCMP_WORK_DIR/rtcmp-build-release/rtcmp"

            test -x "$release_mged"
            test -f "$prims_g"
            test -x "$compare_rtcmp"

            echo "Using MGED: $release_mged"
            echo "Using primitives DB: $prims_g"
            echo "Using rtcmp: $compare_rtcmp"

            set +e
            RTCMP_PRIMS_G="$prims_g" \
            MGED="$release_mged" \
            RTCMP="$compare_rtcmp" \
            OUTDIR="$RTCMP_PRIMS_RESULTS_DIR" \
            PERF_SECONDS="$PRIMS_PERF_SECONDS" \
            "$script_path"
            status=$?
            set -e
          fi

          echo "RTCMP_PRIMS_STATUS=$status" >> "$GITHUB_ENV"
          echo "RTCMP_PRIMS_SUMMARY=$RTCMP_PRIMS_RESULTS_DIR/prims_summary.csv" >> "$GITHUB_ENV"

          # Do not exit with $status here; let aggregation run first.
          exit 0

      - name: Run BRL-CAD benchmark
        run: |
          mkdir -p "$BENCHMARK_RESULTS_DIR"

          status=0

          if [ "$RUN_BENCHMARK" = "1" ]; then
            script_path="brlcad/.github/helper-scripts/benchmark_runner.sh"
            test -f "$script_path"
            chmod +x "$script_path"

            # Reuse compare build extracted by rtcmp_generic
            # FIXME: should be brlcad-compare not -release
            benchmark_exe="$(find "$RTCMP_WORK_DIR/brlcad-release" -type f -path '*/bin/benchmark' | sort | head -n 1)"

            if [ -z "$benchmark_exe" ]; then
              echo "Unable to locate benchmark executable under $RTCMP_WORK_DIR/brlcad-compare"
              status=1
            else
              test -x "$benchmark_exe"

              echo "Using benchmark: $benchmark_exe"

              set +e
              BENCHMARKS="$benchmark_exe" \
              OUTDIR="$BENCHMARK_RESULTS_DIR" \
              "$script_path"
              status=$?
              set -e
            fi
          fi

          echo "BENCHMARK_STATUS=$status" >> "$GITHUB_ENV"
          echo "BENCHMARK_SUMMARY=$BENCHMARK_RESULTS_DIR/summary.csv" >> "$GITHUB_ENV"

          # Do not exit with $status here; let aggregation run first.
          exit 0

      - name: Summarize results
        if: always()
        run: |
          script_path="brlcad/.github/helper-scripts/performance_output_aggregator.sh"
          test -f "$script_path"
          chmod +x "$script_path"
          "$script_path"

          if [ -f "$RESULTS_ROOT/dashboard/summary.md" ]; then
            cat "$RESULTS_ROOT/dashboard/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        
      - name: Upload rtcmp results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results
          retention-days: 7