# This file defines Continuous Integration (CI) tests for BRL-CAD using the
# Github Actions framework.  Currently it defines configurations for Windows,
# Linux and OSX.  These tests are run on a fixed schedule, rather than per
# push, and will typically take longer to run.
#
# Tests here are intended to test more expensive integrations and longer
# builds than the ones targeted at per-commit feedback.  The tradeoff is
# that a failure in these tests might be cause by any commit within a
# 24 hour block of time, so the developer will need to track down the
# specifics themselves.

name: Performance tests

on:
  workflow_dispatch:

jobs:

  linux_build:
    name: Linux - BRL-CAD build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    env:
      DEBIAN_FRONTEND: noninteractive
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      # Cache apt package downloads (not installed pkgs)
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/check.yml') }}

      # Install system dependencies
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          # Install X/OpenGL dev pkgs
          sudo apt-get install xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Install tools
          sudo apt-get install astyle re2c xsltproc libxml2-utils
          # Install dependency dev pkgs
          sudo apt-get install zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libeigen3-dev libgdal-dev libassimp-dev libopencv-dev tcl-dev tk-dev
          # Install XCB/OpenGL dev pkgs for Qt - see:
          # https://wiki.qt.io/Building_Qt_6_from_Git
          # https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-xrm-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev
          sudo apt-get install libinput-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: brlcad

      - name: Directory setup
        run: |
          cmake -E make_directory build_linux
          cmake -E make_directory $HOME/.cache
          cmake -E make_directory $HOME/.cache/BRL-CAD

      - name: Configure
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake -S brlcad -B build_linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRLCAD_EXT_PARALLEL=1 -DBRLCAD_BEXT_CLEANUP=ON -DBRLCAD_ENABLE_QT=ON

      - name: Build Package
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake --build build_linux --config Release --target package

      - name: Upload Linux package for performance tests
        uses: actions/upload-artifact@v4
        with:
          name: brlcad-main-linux-package
          path: |
            build_linux/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux_performance:
    name: Performance Runner
    needs: [linux_build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    if: >
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      DEBIAN_FRONTEND: noninteractive

      RESULTS_ROOT: ${{ github.workspace }}/perf-results

      ###
      # Lane aggregation config.
      # Each lane is expected to map to:
      #   <LANE>_DESCRIPTION    "string"
      #   <LANE>_STATUS         PASS | FAIL | SKIP
      #   <LANE>_SUMMARY        path/to/summary/CSV
      ###
      PERF_LANES: "benchmark rtcmp_prims rtcmp_generic"

      RTCMP_GENERIC_ENABLED: "1"
      RTCMP_GENERIC_DESCRIPTION: "run rtcmp comparison and performance tests across general models"
      RTCMP_GENERIC_STATUS: "SKIP"
      RTCMP_GENERIC_SUMMARY: ${{ github.workspace }}/perf-results/rtcmp-generic/summary.csv
      # rtcmp_generic knobs
      RG_RESULTS_DIR: ${{ github.workspace }}/perf-results/rtcmp-generic
      RG_BASELINE_PACKAGE: https://github.com/BRL-CAD/brlcad/releases/download/rel-7-42-0/BRL-CAD_7.42.0_Linux_x86_64.tar.gz
      RG_WORK_DIR: ${{ github.workspace }}/rtcmp-generic-work
      RG_RAYS_PER_VIEW: "1000"
      RG_PERF_SECONDS: "10"
      RG_PERF_FAIL_THRESHOLD_PCT: "20"
      #RG_MODEL_DIRS intentionally omitted for now; runner has built in fallback
      RG_NUM_CPUS: "0"
      RG_PERF_MAX_MEMORY: "0"
      RG_CLEANUP_OUTPUT_ARTIFACTS: "1"
      RG_LOG_LEVEL: "0"

      RTCMP_PRIMS_ENABLED: "1"
      RTCMP_PRIMS_DESCRIPTION: "run comparison on all BRL-CAD primitives"
      RTCMP_PRIMS_STATUS: "SKIP"
      RTCMP_PRIMS_SUMMARY: ${{ github.workspace }}/perf-results/rtcmp-prims/prims_summary.csv
      # rtcmp_prims knobs
      RP_RESULTS_DIR: ${{ github.workspace }}/perf-results/rtcmp-prims
      RP_PERF_SECONDS: "10"

      BENCHMARK_ENABLED: "1"
      BENCHMARK_DESCRIPTION: "run the BRL-CAD benchmark and capture the VGR"
      BENCHMARK_STATUS: "SKIP"
      BENCHMARK_SUMMARY: ${{ github.workspace }}/perf-results/benchmark/summary.csv
      # benchmark knobs
      BM_RESULTS_DIR: ${{ github.workspace }}/perf-results/benchmark
      BM_TIMEFRAME: "32"
      BM_MAXTIME: "300"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: brlcad

      #TODO: do we need this?
      #- name: Install dependencies

      - name: Download BRL-CAD comparison package
        uses: actions/download-artifact@v4
        with:
          name: brlcad-main-linux-package
          path: compare-package

      - name: Run rtcmp generic comparison
        if: always() && env.RTCMP_GENERIC_ENABLED == '1'
        run: |
          # assume the worst
          set -Eeuo pipefail
          echo "RTCMP_GENERIC_STATUS=FAIL" >> "$GITHUB_ENV"
          # make sure dirs exist
          mkdir -p "$RG_RESULTS_DIR"

          script_path="brlcad/.github/helper-scripts/rtcmp_generic_runner.sh"
          test -f "$script_path"
          chmod +x "$script_path"

          compare_pkg="$(find compare-package -type f \( -name '*.tar.gz' -o -name '*.tgz' \) | sort | head -n 1)"
          test -n "$compare_pkg"

          # run the script - map any exposed knobs
          WORK_DIR="$RG_WORK_DIR" \
          RESULTS_DIR="$RG_RESULTS_DIR" \
          RAYS_PER_VIEW="$RG_RAYS_PER_VIEW" \
          PERF_SECONDS="$RG_PERF_SECONDS" \
          PERF_FAIL_THRESHOLD_PCT="$RG_PERF_FAIL_THRESHOLD_PCT" \
          "$script_path" "$RG_BASELINE_PACKAGE" "$compare_pkg"

          # success
          echo "RTCMP_GENERIC_STATUS=PASS" >> "$GITHUB_ENV"

      - name: Run rtcmp primitive performance
        if: always() && env.RTCMP_PRIMS_ENABLED == '1'
        run: |
          # assume the worst
          set -Eeuo pipefail
          echo "RTCMP_PRIMS_STATUS=FAIL" >> "$GITHUB_ENV"
          # make sure dirs exist
          mkdir -p "$RP_RESULTS_DIR"

          script_path="brlcad/.github/helper-scripts/rtcmp_prims_runner.sh"
          test -f "$script_path"
          chmod +x "$script_path"

          # cheat: ensure rtcmp_generic ran first, so reuse its baseline build
          baseline_mged="$(find "$RG_WORK_DIR/brlcad-baseline" -type f -path '*/bin/mged' -print -quit)"
          brl_prefix="$(dirname "$(dirname "$baseline_mged")")"
          prims_g="$brl_prefix/share/db/primitives.g"
          compare_rtcmp="$RG_WORK_DIR/rtcmp-build-compare/rtcmp"

          test -x "$baseline_mged"
          test -f "$prims_g"
          test -x "$compare_rtcmp"

          echo "Using MGED: $baseline_mged"
          echo "Using primitives DB: $prims_g"
          echo "Using rtcmp: $compare_rtcmp"

          RTCMP_PRIMS_G="$prims_g" \
          MGED="$baseline_mged" \
          RTCMP="$compare_rtcmp" \
          OUTDIR="$RP_RESULTS_DIR" \
          PERF_SECONDS="$RP_PERF_SECONDS" \
          "$script_path"

          echo "RTCMP_PRIMS_STATUS=PASS" >> "$GITHUB_ENV"

      - name: Run BRL-CAD benchmark
        if: always() && env.BENCHMARK_ENABLED == '1'
        run: |
          set -Eeuo pipefail
          echo "BENCHMARK_STATUS=FAIL" >> "$GITHUB_ENV"
          mkdir -p "$BM_RESULTS_DIR"

          script_path="brlcad/.github/helper-scripts/benchmark_runner.sh"
          test -f "$script_path"
          chmod +x "$script_path"

          # cheat: ensure rtcmp_generic runs first so we can reuse the builds
          baseline_benchmark="$(find "$RG_WORK_DIR/brlcad-baseline" -type f -path '*/bin/benchmark' -print -quit)"
          test -x "$baseline_benchmark"
          compare_benchmark="$(find "$RG_WORK_DIR/brlcad-compare" -type f -path '*/bin/benchmark' -print -quit)"
          test -x "$compare_benchmark"
          benchmarks="$baseline_benchmark $compare_benchmark"

          echo "Using benchmarks: $benchmarks"

          BENCHMARKS="$benchmarks" \
          OUTDIR="$BM_RESULTS_DIR" \
          BENCHMARK_TIMEFRAME="$BM_TIMEFRAME" \
          BENCHMARK_MAXTIME="$BM_MAXTIME" \
          "$script_path"

          echo "BENCHMARK_STATUS=PASS" >> "$GITHUB_ENV"

      - name: Summarize results
        if: always()
        run: |
          script_path="brlcad/.github/helper-scripts/performance_output_aggregator.py"
          test -f "$script_path"
          python3 "$script_path"

          if [ -f "$RESULTS_ROOT/summary/summary.md" ]; then
            cat "$RESULTS_ROOT/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        
      - name: Upload rtcmp results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results
          retention-days: 7

      - name: Checkout performance dashboard
        if: always()
        uses: actions/checkout@v4
        with:
          repository: f4alt/brlcad_performance_dashboard
          path: brlcad_performance_dashboard
          ssh-key: ${{ secrets.DASHBOARD_DEPLOY_KEY }}

      - name: Commit performance summary to dashboard
        if: always()
        run: |
          set -Eeuo pipefail

          src="$RESULTS_ROOT/summary/summary.json"
          test -f "$src"

          short_sha="${GITHUB_SHA::12}"
          timestamp="$(date -u +'%Y-%m-%dT%H%M%SZ')"
          run_id="${timestamp}-${short_sha}"

          dest_dir="brlcad_performance_dashboard/data/uploads/${run_id}"
          mkdir -p "$dest_dir"

          cp "$src" "$dest_dir/summary.json"

          cd brlcad_performance_dashboard

          git config user.name "brlcad-performance-bot"
          git config user.email "brlcad-performance-bot@users.noreply.github.com"

          git add "data/uploads/${run_id}/summary.json"

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git commit -m "Add BRL-CAD performance summary ${run_id}"
          git push

      - name: Check performance lane status
        if: always()
        shell: bash
        run: |
          failed=0

          for lane in $PERF_LANES; do
            upper="$(printf '%s' "$lane" | tr '[:lower:]-' '[:upper:]_')"
            status_var="${upper}_STATUS"
            status="${!status_var:-FAIL}"

            printf '%s: %s\n' "$lane" "$status"

            case "$status" in
              PASS|SKIP) ;;
              *) failed=1 ;;
            esac
          done

          exit "$failed"